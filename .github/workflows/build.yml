name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_script: dist:win
            artifact_glob: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            name: macos
            build_script: dist:mac
            artifact_glob: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.name }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip electron-builder's auto-publish; the release step below
          # uploads artifacts explicitly on tag pushes only.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.build_script }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: walking-pet-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
