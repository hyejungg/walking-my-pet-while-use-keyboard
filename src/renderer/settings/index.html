<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Walking Pet 설정</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="title">
        <h1>Walking Pet</h1>
        <p class="subtitle">타자를 치면 펫이 움직여요</p>
      </header>

      <section>
        <h2>테마</h2>
        <div id="theme-list" class="theme-list"></div>

        <details class="reaction-toggle">
          <summary>동작 안내 보기</summary>
          <p class="hint">현재 테마의 자세를 함께 보여드려요.</p>
          <div id="reaction-list" class="reaction-list"></div>
        </details>
      </section>

      <section>
        <h2>크기</h2>
        <div class="size-options">
          <label class="size-option">
            <input type="radio" name="pet-size" value="small" />
            <span>작게</span>
          </label>
          <label class="size-option">
            <input type="radio" name="pet-size" value="medium" />
            <span>보통</span>
          </label>
          <label class="size-option">
            <input type="radio" name="pet-size" value="large" />
            <span>크게</span>
          </label>
        </div>
      </section>

      <section>
        <h2>동작</h2>
        <label class="row">
          <input type="checkbox" id="auto-launch" />
          <span>로그인 시 자동으로 실행하기</span>
        </label>
        <button id="reset-position" class="row-btn">펫 위치 초기화</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
